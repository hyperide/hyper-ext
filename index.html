<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <title>HyperIDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/dist/client/global.css" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Node-ism shim: transitive deps (@babel/types via shared/i18n-text, pulled in by
         PlatformProvider) read bare `process.env.*` at module scope. Browsers have no
         `process`, so the whole entry module throws a ReferenceError and the app
         white-screens (HYP-855). Must run BEFORE the module script below. -->
    <script>
      window.process = window.process || { env: {} };
    </script>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
