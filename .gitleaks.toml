# .gitleaks.toml — gitleaks config for the secret-scan gate (CI + local pre-commit).
#
# Secret-scanning standard = gitleaks. This file is auto-detected at the repo root by
# every gitleaks invocation in this repo:
#   - CI backstop:      .github/workflows/secret-scan.yml  (gitleaks git, full history)
#   - local pre-commit: lefthook.yml `secret-scan` step    (gitleaks git --staged)
#   - generic runner:   ci/secret-scan/secret-scan.sh
#
# TIER: BLOCK. We inherit gitleaks' maintained provider ruleset (AWS, GCP, Azure, GitHub,
# Slack, Stripe, PEM private keys, JWTs, ...) and add NO fuzzy custom rules — custom block
# rules that aren't high-confidence (fixed prefix + length) only generate noise people
# learn to ignore. If you ever need a custom rule, keep it tight or it doesn't belong here.

title = "hyperide"

[extend]
# Pull in gitleaks' built-in, regularly-updated rules for hundreds of providers.
useDefault = true

# -----------------------------------------------------------------------------------------
# [allowlist] — the false-positive escape hatch. ALWAYS keep this section as the documented
# recourse so the gate never has to be ripped out when it flags a vetted non-secret.
#
# THREE ways to silence a false positive (in order of preference):
#   1. Inline   — add a `gitleaks:allow` comment on the offending line (most targeted).
#   2. Allowlist — add a `paths` / `regexes` / `stopwords` entry below (repo-wide).
#   3. Fingerprint — add the finding's `commit:path:rule:line` to .gitleaksignore (history).
#
# RULE: only allowlist PROVEN non-secrets (documented example keys like AKIAIOSFODNN7EXAMPLE,
# test fixtures, doc placeholders). NEVER wave through a real credential "for now" — rotate
# it and scrub it instead. A leaked secret in git history is effectively permanent.
# -----------------------------------------------------------------------------------------
[allowlist]
description = "Vetted false positives — proven non-secrets only (see the rule above)."

# Specific literal non-secret strings to ignore wherever they appear. Add documented sample
# keys here (these never grant access). gitleaks requires this section to hold at least one
# real check, so it ships seeded with AWS' official docs example credentials — both are
# published non-secrets. Extend with your own proven sample keys.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',                        # AWS docs example access key id
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',     # AWS docs example secret access key
]

# Files/paths that are example/fixture material by construction. Add a path regex here only
# after confirming by eye it contains no real credentials. Examples (uncomment / extend):
# paths = [
#   '''.*\.example$''',                 # *.example template files
#   '''(^|/)__tests__/.*''',            # unit-test fixtures
#   '''(^|/)docs/.*\.md$''',            # documentation placeholders
# ]

# Dependency/build-directory exclusions for `gitleaks dir` (working-tree-only) scans live
# in .gitleaks-dir.toml, NOT here — this base config stays GLOBAL (git/--staged/full
# history, i.e. every mode that only ever sees TRACKED content) so a `git add -f`'d file
# under node_modules/, an out/ dir, dist/, etc. is still scanned by every mode except the
# working-tree walk that can't tell tracked from untracked filesystem noise anyway. See
# .gitleaks-dir.toml's header for the dir-mode rationale. Previously these paths were
# excluded HERE (all modes) — moved out because a global exclusion silently blinds the
# git-history and --staged pre-commit scans to a force-added file under one of these
# paths, which is exactly the class of finding those modes exist to catch.
#
# Deliberately NOT excluding .env/.env.* anywhere (not here, not in .gitleaks-dir.toml):
# this [allowlist] is GLOBAL, and an .env-shaped path exclusion would blind the
# `gitleaks git --staged` pre-commit hook and the `full` history mode to a real secret
# that actually got committed — which is exactly the case those modes exist to catch. A
# residual: a `dir`-mode ship-time scan can false-block on a real, correctly-gitignored
# local .env that was never going to be part of the PR being merged either way.
