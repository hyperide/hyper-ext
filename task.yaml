# task.yaml — per-repo task-cli config (native format, read by task-cli's config cascade).
#
# Routes `task new` to the tracker at https://tasks.glide.vc, team HYP (CTO decision #4136.4). GitHub
# Issues are DISABLED on this repo, so the default `github-issues` backend hits a disabled endpoint
# (HTTP 410) and ticket creation fails. This routing previously lived in rig.yaml's top-level `task:`
# block, but rig-cli's schema was closed at the top level and rejected any key it did not own — `task`
# raised "unknown top-level key: task" (exit 2), blocking `rig status` / `rig apply` on this repo. rig-cli
# now supports a `task:` block (alex-mextner/rig-cli#276) — migrating this file's content back into
# rig.yaml is possible but is a separate, optional follow-up, not bundled into this change.
#
# task-cli's cascade (tasklib/config.py: defaults → ~/.config global → rig.yaml `task:` →
# this task.yaml → --config) reads this native file with HIGHER precedence than rig.yaml.
version: 1
backend: tasks
tasks:
  url: https://tasks.glide.vc
  team: HYP
  # Screenshots stay in the PR's `#screenshots` section; the ticket gets a link, not a duplicate upload
  # (the tasks backend would otherwise default to `native` and re-upload local files).
  attachment_mode: link
