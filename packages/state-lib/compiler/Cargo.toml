[package]
name = "statec"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
serde_json = "=1.0.150"
oxc_ast = "=0.150.0"
oxc_allocator = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_span = "=0.150.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
