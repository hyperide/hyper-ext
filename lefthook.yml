pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit && npx tsc --noEmit -p vscode-extension/hypercanvas-preview/tsconfig.json
    react-hooks-import:
      glob: "*.{tsx,ts}"
      run: node scripts/check-react-hooks-import.cjs {staged_files}
