pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      # TODO: extension tsc has 15 pre-existing errors — fix them to enable strict typecheck
      # run: npx tsc --noEmit -p vscode-extension/hypercanvas-preview/tsconfig.json
      run: npx tsc --noEmit
    react-hooks-import:
      glob: "*.{tsx,ts}"
      run: node scripts/check-react-hooks-import.js {staged_files}
