pre-commit:
  parallel: true
  commands:
    secret-scan:
      # Block secrets BEFORE the commit lands (gitleaks, the secret-scanning standard).
      # Scans the STAGED diff only; `git --staged` is the modern form of `gitleaks protect
      # --staged`. BLOCK tier: a high-confidence finding (real provider credential / PEM
      # private key) aborts the commit. .gitleaks.toml at the repo root is auto-detected.
      # CI re-runs this on every push as the backstop (.github/workflows/secret-scan.yml),
      # so this hook is speed, not enforcement — a committer can always --no-verify.
      # False positive? add a `gitleaks:allow` comment on the line, or an [allowlist] entry
      # in .gitleaks.toml. Never silence a real leak — rotate and scrub it.
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "WARNING: gitleaks not installed — skipping local secret scan (CI still gates)." >&2
          echo "  install it: brew install gitleaks  (https://github.com/gitleaks/gitleaks)" >&2
          exit 0
        fi
        if ! gitleaks git --staged --redact --no-banner -v; then
          echo "BLOCKED: a high-confidence secret was found in the staged changes." >&2
          echo "  remove it and rotate it before committing." >&2
          echo "  false positive? add a 'gitleaks:allow' comment on the line, or an" >&2
          echo "  [allowlist] entry in .gitleaks.toml." >&2
          exit 1
        fi
    lint:
      glob: '*.{ts,tsx,js,jsx}'
      run: |
        OXLINT="$(git rev-parse --path-format=absolute --git-common-dir)/../node_modules/.bin/oxlint"
        if [ -x "$OXLINT" ]; then
          "$OXLINT" --config .oxlintrc.json --no-error-on-unmatched-pattern {staged_files} < /dev/null
        else
          npx --yes oxlint --config .oxlintrc.json --no-error-on-unmatched-pattern {staged_files} < /dev/null
        fi
    format:
      glob: '*.{ts,tsx,js,jsx,json,jsonc,css,md}'
      run: |
        OXFMT="$(git rev-parse --path-format=absolute --git-common-dir)/../node_modules/.bin/oxfmt"
        if [ -x "$OXFMT" ]; then
          "$OXFMT" --write --no-error-on-unmatched-pattern {staged_files} < /dev/null
        else
          npx --yes oxfmt --write --no-error-on-unmatched-pattern {staged_files} < /dev/null
        fi
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      # TODO: re-enable `&& npx tsgo --noEmit -p vscode-extension/hypercanvas-preview/tsconfig.json`
      # once pre-existing TS6059 rootDir errors (and missing @types/vscode in worktree) are resolved.
      run: |
        TSGO="$(git rev-parse --path-format=absolute --git-common-dir)/../node_modules/.bin/tsgo"
        if [ -x "$TSGO" ]; then
          "$TSGO" --noEmit < /dev/null
        else
          echo "ERROR: tsgo not found in node_modules/.bin — run 'bun install' first" >&2
          exit 1
        fi
    react-hooks-import:
      glob: '*.{tsx,ts}'
      run: node scripts/check-react-hooks-import.cjs {staged_files}
    no-conflict-markers:
      glob: '*.{ts,tsx,js,jsx,json,md,yml,yaml,css,scss}'
      run: |
        FILES=$(git diff --cached --name-only --diff-filter=ACMR | grep -v "node_modules" | grep -E "\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss)$")
        if [ -z "$FILES" ]; then exit 0; fi
        FOUND=""
        while IFS= read -r f; do
          RESULT=$(git show ":$f" 2>/dev/null | grep -n "^<<<<<<< \|^=======$\|^>>>>>>> ")
          if [ -n "$RESULT" ]; then
            FOUND="$FOUND\n$f:\n$RESULT"
          fi
        done <<< "$FILES"
        if [ -n "$FOUND" ]; then
          echo "ERROR: Conflict markers found in staged index:"
          printf "%b\n" "$FOUND"
          exit 1
        fi
      stage_fixed: false
    no-ext-bun-lock:
      # The VS Code extension (vscode-extension/hypercanvas-preview) is npm-only:
      # @vscode/vsce runs `npm list` during packaging and a bun.lock breaks `vsce package`.
      # The preinstall guard (scripts/assert-npm.mjs) fails a `bun install` but bun writes
      # bun.lock to disk BEFORE preinstall runs, so the lockfile artifact still appears.
      # This hook is the durable stop: it blocks committing a bun.lock/bun.lockb in the ext.
      # CI re-checks this on every PR (ci.yml extension-build) as the backstop.
      run: |
        BAD=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^vscode-extension/hypercanvas-preview/bun\.lockb?$' || true)
        if [ -n "$BAD" ]; then
          echo "BLOCKED: a bun lockfile is staged in the npm-only VS Code extension:" >&2
          echo "$BAD" >&2
          echo "  The extension is npm-only — a bun.lock breaks 'vsce package' (@vscode/vsce runs 'npm list')." >&2
          echo "  Remove it:  git rm --cached <file> && rm <file>   then use 'npm ci' in the ext dir, not bun." >&2
          exit 1
        fi

pre-push:
  scripts:
    # Block DIRECT pushes to main/master (HYP-856). GitHub branch protection is a
    # paid feature on this private free-plan repo, so this client-side gate is the
    # enforcement — land changes via a PR (gh ship). This repo's local core.hooksPath
    # bypasses the machine-wide global-hooks dispatcher, hence the committed copy
    # (.lefthook/pre-push/protect-main.sh). Legit release flow (build-and-install.sh)
    # uses the audited escape hatch:
    #   PUSH_MAIN_OK=1 PUSH_MAIN_REASON="why" git push …  (appended to
    #   ~/.cache/agent-tools/overrides.log — never silent).
    # A `scripts:` entry, NOT `commands:` — lefthook SKIPS pre-push commands whenever
    # its "push files" list is empty (e.g. the first push of a branch), which would
    # fail OPEN; scripts always run. use_stdin: git delivers the pushed refs on the
    # hook's stdin ("<local-ref> <local-sha> <remote-ref> <remote-sha>" lines).
    "protect-main.sh":
      runner: sh
      use_stdin: true
