<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- ============ fig-5-4 Realm transport matrix ============ -->
  <defs>
    <style>
      .title      { font-size: 22px; font-weight: 700; fill: #1f2933; }
      .subtitle   { font-size: 13px; fill: #66727f; }
      .colhdr     { font-size: 14px; font-weight: 700; fill: #1f2933; }
      .rowhdr     { font-size: 13px; font-weight: 700; fill: #1f2933; }
      .rowsub     { font-size: 11px; fill: #8a97a3; }
      .transport  { font-size: 12px; font-weight: 600; fill: #243b53; }
      .note       { font-size: 10.5px; fill: #5b6b7b; }
      .badge      { font-size: 10px; font-weight: 700; }
      .legend     { font-size: 11.5px; fill: #3e4c59; }
      .legendhdr  { font-size: 11.5px; font-weight: 700; fill: #1f2933; }
    </style>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0b1f33" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>

  <text class="title" x="40" y="46">Realm transport matrix</text>
  <text class="subtitle" x="40" y="68">Every DOM capability round-trips through the preview iframe in ALL THREE realms — realms are transport rows, not separate code paths.</text>

  <!-- col x-starts: rowhdr=40..230 ; SaaS=230..460 ; Ext=460..690 ; NodePod=690..900 -->
  <!-- rows: header 92..132; 5 rows of 86 -->

  <rect x="40" y="92" width="860" height="470" rx="8" fill="#ffffff" stroke="#d2dae3" stroke-width="1.5" filter="url(#soft)"/>

  <rect x="40" y="92" width="860" height="40" rx="8" fill="#f3f6f9"/>
  <rect x="40" y="116" width="860" height="16" fill="#f3f6f9"/>

  <text class="rowhdr" x="56" y="117">Capability</text>
  <text class="colhdr" x="345" y="117" text-anchor="middle">SaaS (server-backed)</text>
  <text class="colhdr" x="575" y="117" text-anchor="middle">VS Code ext</text>
  <text class="colhdr" x="795" y="117" text-anchor="middle">serverless (NodePod/OPFS)</text>

  <line x1="230" y1="92" x2="230" y2="562" stroke="#e1e7ee" stroke-width="1"/>
  <line x1="460" y1="92" x2="460" y2="562" stroke="#e1e7ee" stroke-width="1"/>
  <line x1="690" y1="92" x2="690" y2="562" stroke="#e1e7ee" stroke-width="1"/>

  <line x1="40" y1="132" x2="900" y2="132" stroke="#d2dae3" stroke-width="1.5"/>
  <line x1="40" y1="218" x2="900" y2="218" stroke="#e1e7ee" stroke-width="1"/>
  <line x1="40" y1="304" x2="900" y2="304" stroke="#e1e7ee" stroke-width="1"/>
  <line x1="40" y1="390" x2="900" y2="390" stroke="#e1e7ee" stroke-width="1"/>
  <line x1="40" y1="476" x2="900" y2="476" stroke="#e1e7ee" stroke-width="1.5"/>

  <rect x="41" y="218" width="858" height="86" fill="#fafbfc"/>
  <rect x="41" y="390" width="858" height="86" fill="#fafbfc"/>

  <!-- ROW HEADERS -->
  <text class="rowhdr" x="56" y="170">computed-style</text>
  <text class="rowsub" x="56" y="187">getComputedStyle()</text>
  <text class="rowhdr" x="56" y="256">matched-rules</text>
  <text class="rowsub" x="56" y="273">CSS cascade provenance</text>
  <text class="rowhdr" x="56" y="342">settle handshake</text>
  <text class="rowsub" x="56" y="359">render-echo / stylesheet-epoch</text>
  <text class="rowhdr" x="56" y="428">B3 screenshot</text>
  <text class="rowsub" x="56" y="445">pixel capture (NOT Docker)</text>
  <text class="rowhdr" x="56" y="514">A1 LSP/type backstop</text>
  <text class="rowsub" x="56" y="531">forward-detection signal</text>

  <!-- ===== ROW 1: computed-style ===== -->
  <circle cx="252" cy="163" r="6" fill="#2f9e44"/>
  <text class="transport" x="266" y="167">iframe (same-origin)</text>
  <text class="note" x="252" y="188">getComputedStylesFromIframe</text>
  <rect x="252" y="196" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="290" y="208" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="482" cy="163" r="6" fill="#2f9e44"/>
  <text class="transport" x="496" y="167">host→panel→iframe RPC</text>
  <text class="note" x="482" y="188">requestComputedStyle (the panel HAS a DOM)</text>
  <rect x="482" y="196" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="520" y="208" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="712" cy="163" r="6" fill="#2f9e44"/>
  <text class="transport" x="726" y="167">via the iframe</text>
  <text class="note" x="712" y="188">an iframe exists here too</text>
  <rect x="712" y="196" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="750" y="208" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <!-- ===== ROW 2: matched-rules ===== -->
  <circle cx="252" cy="249" r="6" fill="#2f9e44"/>
  <text class="transport" x="266" y="253">iframe document.styleSheets</text>
  <text class="note" x="252" y="274">CSSOM traversal</text>
  <rect x="252" y="282" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="290" y="294" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="482" cy="249" r="6" fill="#2f9e44"/>
  <text class="transport" x="496" y="253">host→panel→iframe RPC</text>
  <text class="note" x="482" y="274">matched-rules RPC (no CDP)</text>
  <rect x="482" y="282" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="520" y="294" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="712" cy="249" r="6" fill="#2f9e44"/>
  <text class="transport" x="726" y="253">via the iframe</text>
  <text class="note" x="712" y="274">styleSheets in the pod iframe</text>
  <rect x="712" y="282" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="750" y="294" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <!-- ===== ROW 3: settle ===== -->
  <circle cx="252" cy="335" r="6" fill="#2f9e44"/>
  <text class="transport" x="266" y="339">import.meta.hot echo</text>
  <text class="note" x="252" y="360">render-echo / stylesheet-epoch</text>
  <rect x="252" y="368" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="290" y="380" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="482" cy="335" r="6" fill="#2f9e44"/>
  <text class="transport" x="496" y="339">awaitRecompile echo</text>
  <text class="note" x="482" y="360">render-echo / stylesheet-epoch</text>
  <rect x="482" y="368" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="520" y="380" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="712" cy="335" r="6" fill="#2f9e44"/>
  <text class="transport" x="726" y="339">via the iframe</text>
  <text class="note" x="712" y="360">same correlated handshake</text>
  <rect x="712" y="368" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="750" y="380" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <!-- ===== ROW 4: screenshot ===== -->
  <circle cx="252" cy="421" r="6" fill="#2f9e44"/>
  <text class="transport" x="266" y="425">browser canvas capture</text>
  <text class="note" x="252" y="446">DOM→canvas</text>
  <rect x="252" y="454" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="290" y="466" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="482" cy="421" r="6" fill="#2f9e44"/>
  <text class="transport" x="496" y="425">preview-panel screenshot RPC</text>
  <text class="note" x="482" y="446">NOT Docker — the live panel</text>
  <rect x="482" y="454" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="520" y="466" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="712" cy="421" r="6" fill="#2f9e44"/>
  <text class="transport" x="726" y="425">via the iframe</text>
  <text class="note" x="712" y="446">capture from the pod iframe</text>
  <rect x="712" y="454" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="750" y="466" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <!-- ===== ROW 5: A1 LSP/type backstop & TypeIntelligence — only serverless degrades (§9.8) ===== -->
  <circle cx="252" cy="507" r="6" fill="#2f9e44"/>
  <text class="transport" x="266" y="511">server-side LS over HTTP</text>
  <text class="note" x="252" y="532">props-TS-program ships; full LS planned</text>
  <rect x="252" y="540" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="290" y="552" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <circle cx="482" cy="507" r="6" fill="#2f9e44"/>
  <text class="transport" x="496" y="511">VS Code language features</text>
  <text class="note" x="482" y="532">workspace TS service (free)</text>
  <rect x="482" y="540" rx="3" width="76" height="16" fill="#e3f4e8"/>
  <text class="badge" x="520" y="552" text-anchor="middle" fill="#2f9e44">No degrade</text>

  <rect x="694" y="486" width="204" height="74" rx="6" fill="#fbf0db" stroke="#e8a33d" stroke-width="1.4"/>
  <circle cx="712" cy="503" r="6" fill="#e8a33d"/>
  <text class="transport" x="726" y="507" fill="#9a6a14">in-pod tsserver, else AST</text>
  <text class="note" x="712" y="525" fill="#8a6320">degrade to AST + heuristic on</text>
  <text class="note" x="712" y="539" fill="#8a6320">cold / fail; never block</text>
  <rect x="724" y="546" rx="3" width="78" height="14" fill="#f6e3c0"/>
  <text class="badge" x="763" y="557" text-anchor="middle" fill="#9a6a14">DEGRADES</text>

  <!-- LEGEND -->
  <text class="legendhdr" x="40" y="592">Status</text>
  <circle cx="115" cy="588" r="6" fill="#2f9e44"/>
  <text class="legend" x="127" y="592">No degrade (DOM cap via iframe; server-backed SaaS &amp; ext get a real LS)</text>
  <rect x="540" y="582" width="12" height="12" rx="2" fill="#fbf0db" stroke="#e8a33d" stroke-width="1.4"/>
  <text class="legend" x="558" y="592">degrades — LSP backstop, serverless (NodePod/OPFS) only</text>

  <text class="subtitle" x="40" y="612" font-size="11" fill="#8a97a3">Fig 5.4 · DOM caps route through the preview iframe; the LSP/type row degrades to AST only on serverless (§9.8).</text>
</svg>
