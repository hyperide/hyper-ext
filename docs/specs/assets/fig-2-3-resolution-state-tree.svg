<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be185d"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1430" height="760" fill="#fbfbfc"/>

  <!-- title -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#111827">Resolution-state decision tree</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Fig 2.3 — the SIX Part-2 resolution-state words: FIVE from resolve+B1 (pre-commit) + collateral-broken from the post-commit B3 visual diff (Part 2.3)</text>

  <!-- root: resolve(field) feeds the FIVE pre-commit resolver/B1 words only -->
  <rect x="494" y="96" width="180" height="56" rx="10" fill="#1f2937"/>
  <text x="584" y="120" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">resolve(field) + B1</text>
  <text x="584" y="139" font-size="11.5" fill="#cbd5e1" text-anchor="middle">classify into one of 5 words</text>

  <!-- SEPARATE source: collateral-broken is NOT a resolver/B1 outcome — it is post-commit B3 -->
  <rect x="1210" y="96" width="180" height="56" rx="10" fill="#831843"/>
  <text x="1300" y="118" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">post-commit B3</text>
  <text x="1300" y="136" font-size="10.5" fill="#fbcfe8" text-anchor="middle">after B1 landed + saga committed</text>

  <line x1="584" y1="152" x2="584" y2="182" stroke="#6b7280" stroke-width="2"/>
  <line x1="130" y1="182" x2="1058" y2="182" stroke="#6b7280" stroke-width="2"/>
  <line x1="130" y1="182" x2="130" y2="214" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372" y1="182" x2="372" y2="214" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="614" y1="182" x2="614" y2="214" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="856" y1="182" x2="856" y2="214" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1058" y1="182" x2="1058" y2="214" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <!-- collateral-broken descends from its OWN post-commit B3 source, not the resolve(field) root -->
  <line x1="1300" y1="152" x2="1300" y2="214" stroke="#be185d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowPink)"/>

  <!-- ============ COLUMN 1: unknown (route, NOT a failure) ============ -->
  <rect x="40" y="218" width="180" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="130" y="240" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">CONDITION</text>
  <text x="130" y="258" font-size="12" fill="#374151" text-anchor="middle">no recognized</text>
  <text x="130" y="273" font-size="12" fill="#374151" text-anchor="middle">StyleSourceOwner</text>
  <line x1="130" y1="282" x2="130" y2="320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="324" width="200" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="350" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="middle">unknown</text>
  <text x="130" y="370" font-size="11" fill="#1d4ed8" text-anchor="middle">NOT a failure — routing input</text>
  <line x1="130" y1="382" x2="130" y2="424" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="428" width="180" height="62" rx="8" fill="#2563eb"/>
  <text x="130" y="451" font-size="11" font-weight="600" fill="#bfdbfe" text-anchor="middle">ACTION</text>
  <text x="130" y="470" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">route-to-policy</text>
  <text x="130" y="485" font-size="10.5" fill="#dbeafe" text-anchor="middle">fall through to priority chain</text>

  <!-- ============ COLUMN 2: inexpressible (static skip) ============ -->
  <rect x="282" y="218" width="180" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="372" y="240" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">CONDITION</text>
  <text x="372" y="258" font-size="12" fill="#374151" text-anchor="middle">static capability</text>
  <text x="372" y="273" font-size="12" fill="#374151" text-anchor="middle">check fails (pre-write)</text>
  <line x1="372" y1="282" x2="372" y2="320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="272" y="324" width="200" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="372" y="350" font-size="17" font-weight="700" fill="#6d28d9" text-anchor="middle">inexpressible</text>
  <text x="372" y="370" font-size="11" fill="#6d28d9" text-anchor="middle">per-candidate, not terminal</text>
  <line x1="372" y1="382" x2="372" y2="424" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="282" y="428" width="180" height="62" rx="8" fill="#7c3aed"/>
  <text x="372" y="451" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="middle">ACTION</text>
  <text x="372" y="470" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">skip-candidate</text>
  <text x="372" y="485" font-size="10.5" fill="#ede9fe" text-anchor="middle">no write; continue down chain</text>

  <!-- ============ COLUMN 3: stale (the only pre-write hard stop) ============ -->
  <rect x="524" y="218" width="180" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="614" y="240" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">CONDITION</text>
  <text x="614" y="258" font-size="12" fill="#374151" text-anchor="middle">DOM↔source identity</text>
  <text x="614" y="273" font-size="12" fill="#374151" text-anchor="middle">drifted (hash mismatch)</text>
  <line x1="614" y1="282" x2="614" y2="320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="514" y="324" width="200" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="614" y="350" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">stale</text>
  <text x="614" y="370" font-size="11" fill="#b45309" text-anchor="middle">identity failure — pre-write stop</text>
  <line x1="614" y1="382" x2="614" y2="424" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524" y="428" width="180" height="62" rx="8" fill="#d97706"/>
  <text x="614" y="447" font-size="11" font-weight="600" fill="#fde68a" text-anchor="middle">ACTION</text>
  <text x="614" y="464" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">re-resolve once, then</text>
  <text x="614" y="479" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">blocking sync-banner</text>

  <!-- ============ COLUMN 4: unlanded (post-write mismatch → rollback) ============ -->
  <rect x="766" y="218" width="180" height="64" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="856" y="240" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">CONDITION</text>
  <text x="856" y="258" font-size="12" fill="#374151" text-anchor="middle">written, but computed</text>
  <text x="856" y="273" font-size="12" fill="#374151" text-anchor="middle">≠ intended (post-write)</text>
  <line x1="856" y1="282" x2="856" y2="320" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="756" y="324" width="200" height="58" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="856" y="350" font-size="17" font-weight="700" fill="#c2410c" text-anchor="middle">unlanded</text>
  <text x="856" y="370" font-size="11" fill="#c2410c" text-anchor="middle">swallowed-prop case</text>
  <line x1="856" y1="382" x2="856" y2="424" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="766" y="428" width="180" height="62" rx="8" fill="#ea580c"/>
  <text x="856" y="447" font-size="11" font-weight="600" fill="#fed7aa" text-anchor="middle">ACTION</text>
  <text x="856" y="464" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">rollback our hunk &amp;</text>
  <text x="856" y="479" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">fall through to next</text>

  <!-- ============ COLUMN 5: unverifiable (fail-closed) ============ -->
  <rect x="968" y="218" width="180" height="64" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="1058" y="240" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">CONDITION</text>
  <text x="1058" y="258" font-size="12" fill="#374151" text-anchor="middle">preview/HMR/computed</text>
  <text x="1058" y="273" font-size="12" fill="#374151" text-anchor="middle">read unavailable</text>
  <line x1="1058" y1="282" x2="1058" y2="320" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="958" y="324" width="200" height="58" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1058" y="350" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">unverifiable</text>
  <text x="1058" y="370" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">could not observe at all</text>
  <line x1="1058" y1="382" x2="1058" y2="424" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="968" y="428" width="180" height="62" rx="8" fill="#b91c1c"/>
  <text x="1058" y="447" font-size="11" font-weight="600" fill="#fecaca" text-anchor="middle">ACTION</text>
  <text x="1058" y="464" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">treat-as-failure</text>
  <text x="1058" y="479" font-size="10.5" fill="#fee2e2" text-anchor="middle">fail-closed (rafVerified ?? false)</text>

  <!-- ============ COLUMN 6: collateral-broken (landed, but broke ELSEWHERE) ============ -->
  <rect x="1210" y="218" width="180" height="64" rx="8" fill="#ffffff" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="1300" y="240" font-size="11" font-weight="600" fill="#be185d" text-anchor="middle">CONDITION</text>
  <text x="1300" y="258" font-size="12" fill="#374151" text-anchor="middle">value landed, but px-diff</text>
  <text x="1300" y="273" font-size="12" fill="#374151" text-anchor="middle">finds damage ELSEWHERE</text>
  <line x1="1300" y1="282" x2="1300" y2="320" stroke="#be185d" stroke-width="2" marker-end="url(#arrowPink)"/>
  <rect x="1200" y="324" width="200" height="58" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2.5"/>
  <text x="1300" y="348" font-size="15.5" font-weight="700" fill="#be185d" text-anchor="middle">collateral-broken</text>
  <text x="1300" y="368" font-size="11" font-weight="600" fill="#be185d" text-anchor="middle">success that did damage</text>
  <text x="1300" y="380" font-size="9.5" fill="#9d174d" text-anchor="middle">deterministic CV (non-AI); §9.7 escalation</text>
  <line x1="1300" y1="382" x2="1300" y2="424" stroke="#be185d" stroke-width="2" marker-end="url(#arrowPink)"/>
  <rect x="1210" y="428" width="180" height="62" rx="8" fill="#be185d"/>
  <text x="1300" y="447" font-size="11" font-weight="600" fill="#fbcfe8" text-anchor="middle">ACTION</text>
  <text x="1300" y="464" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">rollback writeId &amp;</text>
  <text x="1300" y="479" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">surface (§8.4-bis UX)</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="556" width="1350" height="172" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="60" y="582" font-size="13" font-weight="700" fill="#374151">Legend — these are the six DOCTRINE words (Part 2.3); never conflated</text>

  <rect x="60" y="596" width="22" height="16" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="609" font-size="12" fill="#374151">unknown = no owner yet → route (NOT a failure)</text>

  <rect x="500" y="596" width="22" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="532" y="609" font-size="12" fill="#374151">inexpressible = static can't → skip THIS candidate</text>

  <rect x="940" y="596" width="22" height="16" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="972" y="609" font-size="12" fill="#374151">stale = identity drift → only pre-write stop</text>

  <rect x="60" y="624" width="22" height="16" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="92" y="637" font-size="12" fill="#374151">unlanded = wrote, didn't land → rollback &amp; fall through</text>

  <rect x="500" y="624" width="22" height="16" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="532" y="637" font-size="12" fill="#374151">unverifiable = couldn't observe → fail-closed (gated by confidence, §9.4)</text>

  <rect x="940" y="624" width="22" height="16" rx="4" fill="#fdf2f8" stroke="#be185d" stroke-width="2.5"/>
  <text x="972" y="637" font-size="12" fill="#374151">collateral-broken = landed but broke elsewhere → rollback &amp; surface</text>

  <text x="60" y="676" font-size="12" fill="#6b7280">collateral-broken is NOT a resolve(field)/B1 outcome — it is produced POST-commit by the §9.6 B3 visual diff (deterministic, non-AI; AI-vision §9.7 is escalation only), so it is not a §9.4 matrix column.</text>

  <text x="60" y="704" font-size="12" fill="#6b7280">Each column reads top &#8594; bottom:</text>
  <rect x="252" y="692" width="92" height="18" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="298" y="705" font-size="11" fill="#374151" text-anchor="middle">condition</text>
  <text x="352" y="705" font-size="12" fill="#9ca3af">&#8594;</text>
  <rect x="366" y="692" width="92" height="18" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="412" y="705" font-size="11" fill="#374151" text-anchor="middle">state word</text>
  <text x="466" y="705" font-size="12" fill="#9ca3af">&#8594;</text>
  <rect x="480" y="692" width="92" height="18" rx="4" fill="#374151"/>
  <text x="526" y="705" font-size="11" fill="#ffffff" text-anchor="middle">action</text>
  <text x="586" y="705" font-size="12" fill="#6b7280">resolve(field)+B1 classifies into one of the FIVE pre-commit words; collateral-broken is the separate POST-commit B3 word.</text>
</svg>
