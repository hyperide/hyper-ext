<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#475569"/>
    </marker>
    <marker id="arrowMerge" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowDiscard" markerWidth="11" markerHeight="11" refX="8.5" refY="3.4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8.5,3.4 L0,6.8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Static snapshot vs runtime overlay lifecycle</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Fig 6.3 — cacheable static layer + ephemeral overlay merged at render; overlay discarded on selection change</text>

  <!-- ============ STATIC LAYER (cacheable, persistent) ============ -->
  <g>
    <rect x="40" y="110" width="350" height="270" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="64" y="142" font-size="16" font-weight="700" fill="#0f172a">Static snapshot layer</text>
    <text x="64" y="163" font-size="12" fill="#64748b">cacheable &#183; persists across selections</text>

    <!-- cache key chip -->
    <rect x="64" y="180" width="302" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="80" y="200" font-size="11.5" font-weight="600" fill="#334155">cache key</text>
    <text x="80" y="214" font-size="12.5" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(elementKey, styleVersion)</text>

    <!-- snapshot entries -->
    <rect x="64" y="234" width="302" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <circle cx="84" cy="252" r="5" fill="#16a34a"/>
    <text x="98" y="256" font-size="12.5" font-weight="600" fill="#14532d">source-parsed declarations</text>
    <text x="98" y="276" font-size="11" fill="#166534" font-family="ui-monospace, 'SF Mono', Menlo, monospace">pure function of source &#183; cacheable</text>

    <rect x="64" y="302" width="302" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <circle cx="84" cy="320" r="5" fill="#16a34a"/>
    <text x="98" y="324" font-size="12.5" font-weight="600" fill="#14532d">declHash (xxhash64)</text>
    <text x="98" y="344" font-size="11" fill="#166534" font-family="ui-monospace, 'SF Mono', Menlo, monospace">merge fast path &#183; stable until styleVersion bumps</text>
  </g>

  <!-- ============ OVERLAY LAYER (ephemeral) ============ -->
  <g>
    <rect x="40" y="410" width="350" height="170" rx="12" fill="#fef9f3" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="64" y="442" font-size="16" font-weight="700" fill="#0f172a">Runtime overlay</text>
    <text x="64" y="463" font-size="12" fill="#92400e">ephemeral &#183; scoped to selectionEpoch</text>

    <!-- epoch chip -->
    <rect x="64" y="478" width="302" height="40" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="80" y="498" font-size="11.5" font-weight="600" fill="#92400e">scope</text>
    <text x="80" y="512" font-size="12.5" fill="#7c2d12" font-family="ui-monospace, 'SF Mono', Menlo, monospace">selectionEpoch = N</text>

    <rect x="64" y="528" width="302" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="80" y="548" font-size="11.5" fill="#7c2d12">live getComputedStyle fills for UNKNOWN static fields</text>
    <text x="80" y="562" font-size="10.5" fill="#92400e">empty Map in ext host &#183; fills only, never overwrites</text>
  </g>

  <!-- ============ MERGE POINT ============ -->
  <g>
    <!-- static -> merge -->
    <path d="M390 255 C 470 255, 470 305, 560 305" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- overlay -> merge -->
    <path d="M390 498 C 470 498, 470 345, 560 345" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

    <!-- merge node -->
    <rect x="565" y="290" width="160" height="70" rx="35" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="645" y="320" font-size="15" font-weight="700" fill="#1d3a8a" text-anchor="middle">merge</text>
    <text x="645" y="340" font-size="11" fill="#1e40af" text-anchor="middle">overlay over snapshot</text>

    <!-- merge -> rendered output -->
    <path d="M725 325 L 805 325" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrowMerge)"/>
    <rect x="810" y="288" width="132" height="74" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="876" y="316" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Rendered</text>
    <text x="876" y="334" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Inspector</text>
    <text x="876" y="351" font-size="10.5" fill="#64748b" text-anchor="middle">per frame</text>
  </g>

  <!-- ============ SELECTION CHANGE -> DISCARD OVERLAY ============ -->
  <g>
    <!-- selection change trigger -->
    <rect x="565" y="448" width="160" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <text x="645" y="472" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">selection change</text>
    <text x="645" y="491" font-size="10.5" fill="#b91c1c" text-anchor="middle">selectionEpoch &#8594; N+1</text>

    <!-- discard arrow: trigger -> overlay box (X) -->
    <path d="M565 484 C 470 484, 470 548, 372 548" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="2 4" marker-end="url(#arrowDiscard)"/>
    <text x="468" y="535" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">discard overlay</text>

    <!-- static layer is preserved (key unchanged) -->
    <path d="M645 448 L 645 365" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="650" y="408" font-size="10.5" fill="#64748b">snapshot survives</text>
    <text x="650" y="423" font-size="10.5" fill="#64748b">(cache key unchanged)</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="40" y="592" width="900" height="0.8" fill="#e2e8f0"/>
    <rect x="44" y="600" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="64" y="611" font-size="11.5" fill="#475569">static / cacheable (green, solid)</text>

    <rect x="270" y="600" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="290" y="611" font-size="11.5" fill="#475569">ephemeral overlay (amber, dashed)</text>

    <rect x="520" y="600" width="14" height="14" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="540" y="611" font-size="11.5" fill="#475569">merge / render (blue)</text>

    <line x1="710" y1="607" x2="734" y2="607" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="2 4"/>
    <text x="740" y="611" font-size="11.5" fill="#475569">discard on selection change (red)</text>
  </g>
</svg>
