<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d4f"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="760" fill="#fafbfc"/>

  <!-- title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1c2430">Convergence: from two engines to one</text>
  <text x="40" y="74" font-size="14" fill="#5b6472">Fig 5.3 — Styles master spec · before/after migration of the style read/write core</text>

  <!-- ============ BEFORE PANEL ============ -->
  <g>
    <rect x="40" y="104" width="560" height="560" rx="10" fill="#ffffff" stroke="#d4d9e0" stroke-width="1.5"/>
    <text x="64" y="138" font-size="18" font-weight="700" fill="#1c2430">BEFORE — two systems</text>
    <text x="64" y="160" font-size="12.5" fill="#7a828f">System A (client adapters) vs System B (shared lib/) — one funnel, two converters</text>

    <!-- Inspector consumer -->
    <rect x="76" y="184" width="200" height="56" rx="8" fill="#eef1f6" stroke="#b9c1cd" stroke-width="1.3"/>
    <text x="176" y="208" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Inspector UI</text>
    <text x="176" y="227" font-size="11.5" fill="#7a828f" text-anchor="middle">style editing panel</text>

    <!-- Preview consumer -->
    <rect x="364" y="184" width="200" height="56" rx="8" fill="#eef1f6" stroke="#b9c1cd" stroke-width="1.3"/>
    <text x="464" y="208" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Preview / Canvas</text>
    <text x="464" y="227" font-size="11.5" fill="#7a828f" text-anchor="middle">on-element render</text>

    <!-- System A: client adapters (ParsedStyles) -->
    <rect x="76" y="288" width="200" height="184" rx="9" fill="#fbeeec" stroke="#c0392b" stroke-width="1.6"/>
    <text x="176" y="312" font-size="14" font-weight="700" fill="#8c2a1e" text-anchor="middle">System A — client</text>
    <text x="176" y="328" font-size="11" fill="#a85a4d" text-anchor="middle">canvas-engine adapters</text>

    <rect x="96" y="338" width="160" height="40" rx="6" fill="#ffffff" stroke="#d89b92" stroke-width="1.1"/>
    <text x="176" y="356" font-size="12" font-weight="600" fill="#8c2a1e" text-anchor="middle">ParsedStyles</text>
    <text x="176" y="371" font-size="10.5" fill="#a85a4d" text-anchor="middle">editable values</text>

    <rect x="96" y="388" width="160" height="44" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
    <text x="176" y="408" font-size="11.5" font-weight="700" fill="#8c2a1e" text-anchor="middle">classNameToStyles</text>
    <text x="176" y="423" font-size="10" fill="#a85a4d" text-anchor="middle">converter #1 (useElementStyleData:113)</text>

    <!-- System B: shared lib/ engine -->
    <rect x="364" y="288" width="200" height="184" rx="9" fill="#fbeeec" stroke="#c0392b" stroke-width="1.6"/>
    <text x="464" y="312" font-size="14" font-weight="700" fill="#8c2a1e" text-anchor="middle">System B — shared lib/</text>
    <text x="464" y="328" font-size="11" fill="#a85a4d" text-anchor="middle">the real file mutation</text>

    <rect x="384" y="338" width="160" height="40" rx="6" fill="#ffffff" stroke="#d89b92" stroke-width="1.1"/>
    <text x="464" y="353" font-size="11" font-weight="600" fill="#8c2a1e" text-anchor="middle">StyleReadManager /</text>
    <text x="464" y="368" font-size="11" font-weight="600" fill="#8c2a1e" text-anchor="middle">StyleWriteManager</text>

    <rect x="384" y="388" width="160" height="44" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
    <text x="464" y="408" font-size="11.5" font-weight="700" fill="#8c2a1e" text-anchor="middle">TailwindV4Reader</text>
    <text x="464" y="423" font-size="10" fill="#a85a4d" text-anchor="middle">converter #2 (lib/style-adapters)</text>

    <!-- duplicate debt callout: converter pair = D23 (no test count) -->
    <rect x="76" y="490" width="488" height="40" rx="8" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="320" y="510" font-size="12.5" font-weight="700" fill="#8c2a1e" text-anchor="middle">DUPLICATE CONVERTER PAIR — classNameToStyles vs TailwindV4Reader</text>
    <text x="320" y="525" font-size="11" fill="#a85a4d" text-anchor="middle">two read shapes that must agree; silent drift = debt (D23)</text>

    <!-- separate parser-layer box BENEATH the converters (the 95-vs-2 test count belongs HERE, D37) -->
    <rect x="76" y="536" width="488" height="38" rx="8" fill="#fbf7ee" stroke="#b08a3a" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="320" y="555" font-size="11.5" font-weight="700" fill="#7a5e1f" text-anchor="middle">parser layer beneath: client tailwindParser (2 tests) vs lib/tailwind/parser (95 tests)</text>
    <text x="320" y="569" font-size="10.5" fill="#9a7a30" text-anchor="middle">thin-test divergence risk = D37 — a DIFFERENT axis from the converter pair</text>

    <!-- consumer -> system arrows -->
    <line x1="176" y1="240" x2="176" y2="286" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="464" y1="240" x2="464" y2="286" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- the duplicated converter link -->
    <line x1="276" y1="410" x2="384" y2="410" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
    <text x="330" y="402" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">≠ must agree</text>

    <text x="64" y="588" font-size="11.5" fill="#7a828f">Realms are transport rows over ONE engine — the real split is System A's adapters vs System B's lib/, with two converters.</text>
  </g>

  <!-- ============ ARROW between panels ============ -->
  <g>
    <line x1="610" y1="384" x2="676" y2="384" stroke="#2e7d4f" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="643" y="372" font-size="12" font-weight="700" fill="#2e7d4f" text-anchor="middle">unify</text>
  </g>

  <!-- ============ AFTER PANEL ============ -->
  <g>
    <rect x="688" y="104" width="552" height="560" rx="10" fill="#ffffff" stroke="#c2d6c8" stroke-width="1.5"/>
    <text x="712" y="138" font-size="18" font-weight="700" fill="#1c2430">AFTER — one core</text>
    <text x="712" y="160" font-size="12.5" fill="#7a828f">Single engine in lib/, realm-specific transport shells</text>

    <!-- Inspector consumer -->
    <rect x="724" y="184" width="200" height="56" rx="8" fill="#eef1f6" stroke="#b9c1cd" stroke-width="1.3"/>
    <text x="824" y="208" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Inspector UI</text>
    <text x="824" y="227" font-size="11.5" fill="#7a828f" text-anchor="middle">style editing panel</text>

    <!-- Preview consumer -->
    <rect x="1004" y="184" width="200" height="56" rx="8" fill="#eef1f6" stroke="#b9c1cd" stroke-width="1.3"/>
    <text x="1104" y="208" font-size="14" font-weight="600" fill="#1c2430" text-anchor="middle">Preview / Canvas</text>
    <text x="1104" y="227" font-size="11.5" fill="#7a828f" text-anchor="middle">on-element render</text>

    <!-- ParsedStyles DELETED — removed-debt callout INSIDE the AFTER panel, in the gap BETWEEN the two
         vertical flow arrows (x=824 inspector, x=1104 preview) so it crosses neither; post-migration state, NOT in the main flow (OD-3: DELETE) -->
    <rect x="902" y="250" width="196" height="66" rx="8" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="1000" y="272" font-size="12" font-weight="700" fill="#8c2a1e" text-anchor="middle"><tspan text-decoration="line-through">ParsedStyles</tspan> — DELETED</text>
    <text x="1000" y="290" font-size="10" fill="#a85a4d" text-anchor="middle">inspector reads the normalized IR directly</text>
    <text x="1000" y="305" font-size="9.5" fill="#a85a4d" text-anchor="middle">OD-3: not in the flow · no @deprecated projection</text>

    <!-- Transport shell: ext -->
    <rect x="724" y="356" width="200" height="50" rx="8" fill="#eef6f0" stroke="#8fc2a4" stroke-width="1.3"/>
    <text x="824" y="377" font-size="12.5" font-weight="600" fill="#1c2430" text-anchor="middle">ext transport shell</text>
    <text x="824" y="393" font-size="10.5" fill="#6c7682" text-anchor="middle">postMessage / RPC bridge</text>

    <!-- Transport shell: preview -->
    <rect x="1004" y="356" width="200" height="50" rx="8" fill="#eef6f0" stroke="#8fc2a4" stroke-width="1.3"/>
    <text x="1104" y="377" font-size="12.5" font-weight="600" fill="#1c2430" text-anchor="middle">preview transport shell</text>
    <text x="1104" y="393" font-size="10.5" fill="#6c7682" text-anchor="middle">in-frame direct call</text>

    <!-- Unified core in lib/ -->
    <rect x="724" y="440" width="480" height="150" rx="10" fill="#e8f4ec" stroke="#2e7d4f" stroke-width="2"/>
    <text x="964" y="468" font-size="15.5" font-weight="700" fill="#1f6b41" text-anchor="middle">Unified style core · lib/</text>
    <text x="964" y="486" font-size="11" fill="#3f8a60" text-anchor="middle">single source of truth — realm-agnostic, implemented</text>

    <rect x="746" y="500" width="140" height="42" rx="6" fill="#ffffff" stroke="#7bbf99" stroke-width="1.2"/>
    <text x="816" y="520" font-size="11.5" font-weight="600" fill="#1f6b41" text-anchor="middle">StyleReadManager</text>
    <text x="816" y="535" font-size="10" fill="#3f8a60" text-anchor="middle">one copy</text>

    <rect x="894" y="500" width="140" height="42" rx="6" fill="#ffffff" stroke="#7bbf99" stroke-width="1.2"/>
    <text x="964" y="520" font-size="11.5" font-weight="600" fill="#1f6b41" text-anchor="middle">StyleWriteManager</text>
    <text x="964" y="535" font-size="10" fill="#3f8a60" text-anchor="middle">one copy</text>

    <rect x="1042" y="500" width="140" height="42" rx="6" fill="#ffffff" stroke="#7bbf99" stroke-width="1.2"/>
    <text x="1112" y="520" font-size="11.5" font-weight="600" fill="#1f6b41" text-anchor="middle">converter / parser</text>
    <text x="1112" y="535" font-size="10" fill="#3f8a60" text-anchor="middle">one copy</text>

    <!-- arrows: consumers -> shells (main flow BYPASSES the deleted ParsedStyles) -->
    <line x1="824" y1="240" x2="824" y2="354" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="838" y="300" font-size="9.5" fill="#5b6472">reads IR directly</text>
    <line x1="1104" y1="240" x2="1104" y2="354" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- shells -> core -->
    <line x1="824" y1="406" x2="824" y2="438" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <line x1="1104" y1="406" x2="1104" y2="438" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

    <text x="712" y="624" font-size="11.5" fill="#7a828f">All realms call the same core through styling-logic-free transport</text>
    <text x="712" y="640" font-size="11.5" fill="#7a828f">shells; the inspector reads the normalized IR. ParsedStyles + the</text>
    <text x="712" y="656" font-size="11.5" fill="#7a828f">duplicate converter are DELETED (OD-3) — no @deprecated projection.</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g>
    <rect x="40" y="690" width="1200" height="48" rx="8" fill="#ffffff" stroke="#d4d9e0" stroke-width="1.2"/>
    <text x="60" y="719" font-size="12.5" font-weight="700" fill="#1c2430">Legend</text>

    <rect x="132" y="708" width="20" height="14" rx="3" fill="#e8f4ec" stroke="#2e7d4f" stroke-width="1.4"/>
    <text x="160" y="719" font-size="12" fill="#3a424e">implemented (unified core)</text>

    <rect x="360" y="708" width="20" height="14" rx="3" fill="#fbeeec" stroke="#c0392b" stroke-width="1.6"/>
    <text x="388" y="719" font-size="12" fill="#3a424e">duplicate / debt</text>

    <rect x="528" y="708" width="20" height="14" rx="3" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="556" y="719" font-size="12" fill="#3a424e">DELETED (removed, not @deprecated)</text>

    <rect x="800" y="708" width="20" height="14" rx="3" fill="#eef6f0" stroke="#8fc2a4" stroke-width="1.4"/>
    <text x="828" y="719" font-size="12" fill="#3a424e">realm transport shell</text>

    <rect x="996" y="708" width="20" height="14" rx="3" fill="#eef1f6" stroke="#b9c1cd" stroke-width="1.3"/>
    <text x="1024" y="719" font-size="12" fill="#3a424e">consumer (UI surface)</text>
  </g>
</svg>
